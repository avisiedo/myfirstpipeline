name: CI/CD - Python Tests y Docker Build

on:
  push:
    # Se activará con un push en CUALQUIER rama
  pull_request:
    # Se activará con un PR en CUALQUIER rama

env:
  # Cambia esto por tu usuario de Docker Hub y el nombre de tu imagen
  IMAGE_NAME: tu-usuario-docker/nombre-de-tu-imagen

jobs:
  # 1. JOB DE PRUEBAS CON PYTEST
  ci:
    name: Ejecutar pruebas con Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # - name: Configurar Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.9"  # Ajusta a la versión que uses
      #     cache: "pip"           # Guarda en caché las dependencias para acelerar el flujo
      - name: Configurar Python
        run: |
          # https://docs.astral.sh/uv/getting-started/installation/
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uv venv --python 3.9
          source .venv/bin/activate
          pip install -U pip

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          ~/.local/bin/uv pip install pytest
          if [ -f "requirements.txt" ]; 
          then 
              ~/.local/bin/uv pip install -r requirements.txt;
          fi

      - name: Ejecutar Pytest
        run: |
          source .venv/bin/activate
          python3 -m pytest -v

  # 2. JOB DE CONSTRUCCIÓN Y DESPLIEGUE EN DOCKER HUB
  # https://github.com/marketplace/actions/build-and-push-docker-images
  cd:
    name: Construir y subir imagen a Docker.io
    needs: ci # Asegura que este paso SOLO ocurra si el job 'ci' tiene éxito
    # Se ejecuta en cada push a CUALQUIER rama (ignora los Pull Requests para evitar builds duplicados)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: docker.io/avisiedo/myfirstpipeline:latest

